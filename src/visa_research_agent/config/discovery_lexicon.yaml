# Scoring vocabulary for source discovery.
#
# Kept as data rather than Python so the weights can be inspected and tuned without a code change,
# for the same reason AGENTS.md keeps prompts in files.
#
# Weights are additive points. Two rules matter more than any individual number:
#   1. Link text outweighs the URL. Japan's tourism checklist lives at "index_000070.html", which
#      carries no signal at all; only its anchor text "Temporary Visitor Visa" identifies it.
#   2. Negative terms are decisive. A student or spouse visa page on the correct domain, in the
#      correct format, is the most dangerous candidate in the pool.

schema_version: 1

# Multiplier applied to a role score earned from the link's own text rather than the URL.
link_text_weight: 1.2

# The nearest heading above a link is weaker evidence than the link's own label: every form
# under a "Visa Application Documents" heading would otherwise look like a checklist.
heading_weight: 0.5

# **Offline corpus builds only (DECISIONS entry 189).** A link's surroundings, used to decide what a
# build opens and never to rank a corridor's candidates, so no live request reads these three.
#
# The text around a link — its list item, paragraph or table cell, and its `title`/`aria-label` —
# counts like a heading, and only for phrases the link's own label and heading do not already carry.
context_weight: 0.5
# A document link (a PDF) with no signal of its own inherits the title of the page it sits on, at a
# quarter weight. Czechia's supporting-documents list for applicants in the United Kingdom is linked
# as "United Kingdom (PDF, 332 KB)" from a page titled "Harmonized List of Supporting Documents"
# (entry 187). Documents only, because a crawl never follows one: this reorders the PDF pass and
# cannot hand a host's HTML links a score that lets them read past its even share (entry 186).
linking_title_weight: 0.25
# A link in a page's footer is usually site furniture, so it is halved. Halved rather than zeroed:
# a footer "Visas" link is still a way into the section.
footer_factor: 0.5

# A link that names the traveller's purpose is worth considering even with no other signal.
# Japan's tourism checklist is reached by a link labelled only "Tourism", at a URL that says
# nothing and never mentions visas.
base_purpose_weight: 18

# An index page mentions every topic, so it scores on every role and beats the page that
# actually answers one of them. Body scores are divided by the square root of how many roles
# the page scored on, which leaves a focused page untouched and pushes a directory down.
breadth_threshold: 2

# A page whose final path segment is exactly "index", "top" or "home" is a section front
# door, not the page that answers a question. Matched on the whole stem, so Japan's
# "index_000070.html" (a real content page with an unhelpful name) is unaffected.
index_page_penalty: -18
index_page_stems: [index, top, home, default, main]

roles:
  visa_decision:
    terms:
      - {phrase: visa requirement, weight: 25}
      - {phrase: visa requirements, weight: 25}
      - {phrase: do i need a visa, weight: 25}
      - {phrase: check if you need, weight: 22}
      - {phrase: visa exemption, weight: 22}
      - {phrase: visa exemptions, weight: 22}
      - {phrase: visa free, weight: 18}
      - {phrase: visa waiver, weight: 18}
      - {phrase: novisa, weight: 20}
      - {phrase: entry visa, weight: 15}
      - {phrase: entry requirements, weight: 12}
      # Added 2026-08-23 (DECISIONS entry 56). The list above asks the question — "do I need a
      # visa", "visa requirements" — and had no way to recognise a page that *states the answer*.
      # Sweden's `list-of-foreign-citizens-who-require-visa-for-entry-into-sweden` matched none of
      # it, scored `general_entry` on the word "entering", and therefore could not qualify its own
      # refusal under DECISIONS entry 32. These are the answering phrasings.
      #
      # **No phrase here may contain, or be contained by, another in this role**, or both fire and
      # the page scores twice. `need a visa` was tried and rejected for exactly that: it sits inside
      # "check if you need a visa", which inflated a Caribbean page past the Netherlands' own
      # United Kingdom application page. See `test_no_new_overlapping_lexicon_terms`.
      - {phrase: needs a visa, weight: 25}
      - {phrase: require a visa, weight: 22}
      - {phrase: requires a visa, weight: 22}
      # The slug form. `searchable_url` flattens hyphens to spaces, and slugs routinely drop the
      # article that prose keeps, so "require-visa-for-entry" never matches "require a visa".
      - {phrase: require visa, weight: 22}
      - {phrase: visa for entry, weight: 20}
      - {phrase: countries whose nationals, weight: 22}
      - {phrase: countries whose citizens, weight: 22}
      # Added 2026-09-25 (TODO item 70, entry 200) for the same reason as the two above: Belgium
      # links its list as "List of third countries that are required to hold a visa", which states
      # the answer and matched nothing but the bare word "visa" (+6). Two hops from a build seed
      # that scored −14, so the list never reached the selector.
      - {phrase: required to hold a visa, weight: 22}
      - {phrase: must hold a visa, weight: 22}
      # Added 2026-10-06 (entry 266). An authority may state the answer as eligibility rather than
      # as a requirement: Home Affairs' ETA page says "You must hold a valid passport from one of
      # these countries… to be eligible" above its list of passports, and matched only "must hold a
      # visa" (+22), 61st of 82 for Australia `US/US`.
      - {phrase: eligible passport, weight: 25}
      - {phrase: passport from one of these countries, weight: 25}

  document_checklist:
    terms:
      - {phrase: documents required, weight: 25}
      - {phrase: required documents, weight: 25}
      - {phrase: items required, weight: 25}
      - {phrase: checklist, weight: 25}
      - {phrase: supporting documents, weight: 20}
      - {phrase: what to submit, weight: 18}
      - {phrase: application documents, weight: 18}
      - {phrase: necessary documents, weight: 18}

  application_route:
    terms:
      # Visa category names. These identify the page a traveller actually starts from, and are
      # often the only signal it has: Japan's is labelled "Temporary Visitor Visa" at a URL of
      # "index_000070.html".
      - {phrase: temporary visitor, weight: 18}
      - {phrase: visitor visa, weight: 18}
      - {phrase: tourist visa, weight: 18}
      - {phrase: short-term stay, weight: 15}
      - {phrase: how to apply, weight: 25}
      - {phrase: evisa, weight: 22}
      - {phrase: e-visa, weight: 22}
      - {phrase: online application, weight: 20}
      - {phrase: apply online, weight: 20}
      - {phrase: application centre, weight: 18}
      - {phrase: application center, weight: 18}
      - {phrase: appointment, weight: 15}
      - {phrase: apply, weight: 8}

  fees:
    # Four terms, and **no scoring candidate at all in six of the twenty oracle corridors** —
    # Germany, Sweden and Singapore, both travellers each (entry 104). All four say "fee" or
    # "charge", so a page that says what a visa costs in any other words scores nothing, and a page
    # scoring nothing for a role can never be selected *for* that role at any budget.
    #
    # The additions are what fee pages actually say, read out of the corpora that scored zero. The
    # one that pays is `consular fee`: the Netherlands publishes `consular-fees/{country}` per
    # traveller, and an Indian corridor's top fee candidate went from 64 to **112.8** on the page
    # for India itself.
    #
    # **`payment` was tried and rejected, and the way it failed is the point.** On counts and scores
    # it looked like the best addition here: it raised Canada's top fee candidate from 51 to 61 and
    # the United States' from 27 to 32. Reading the pages behind those scores, it had promoted
    # `eservices.cic.gc.ca/epay/order.do` — "Pay Your Application Fees, Online Payment" — above the
    # fee schedule. A traveller needs the amount, not the till. **A score that rose is not a page
    # that improved**, which is the same lesson as entry 81's, met in a vocabulary change.
    #
    # `application fee` will double-fire with `fees` on the literal text "application fees", the way
    # `visa fees` already does. That class of overlap is pre-existing and frozen in
    # `test_no_new_overlapping_lexicon_terms`; what the test forbids is a *declared* phrase
    # containing another, and none of these do.
    terms:
      - {phrase: visa fee, weight: 25}
      - {phrase: visa fees, weight: 25}
      - {phrase: fees, weight: 12}
      - {phrase: charges, weight: 10}
      - {phrase: application fee, weight: 22}
      - {phrase: consular fee, weight: 22}
      - {phrase: how much does it cost, weight: 20}
      - {phrase: service fee, weight: 18}

  processing_times:
    # Three terms, and **no scoring candidate in eight of the twenty corridors** — the worst of the
    # six roles (entry 104). Two of the three are the same phrase singular and plural, so this role
    # effectively knew two ways of asking the question.
    #
    # Taken from the pages themselves: GOV.UK publishes "Visa decision **waiting times**", and
    # Sweden's Migrationsverket puts `you-are-waiting-for-a-decision` in the URL path, which
    # `searchable_url` flattens to prose. Neither contains the word "processing". Sweden went from
    # **zero candidates to fifteen**, topped by `migrationsverket.se/en/you-are-waiting-for-a-
    # decision` at 46.4 — the right page, where before nothing scored at all.
    #
    # Singular forms only, deliberately: matching is substring, so `waiting time` already catches
    # "waiting times" without declaring a second phrase that would double-fire. The `processing
    # time`/`processing times` pair above predates that reasoning and is frozen rather than fixed.
    terms:
      - {phrase: processing time, weight: 25}
      - {phrase: processing times, weight: 25}
      - {phrase: how long does it take, weight: 20}
      - {phrase: waiting time, weight: 25}
      - {phrase: waiting for a decision, weight: 22}
      - {phrase: usually takes, weight: 18}
      - {phrase: decision within, weight: 18}
      - {phrase: working days, weight: 15}
      - {phrase: business days, weight: 15}

  general_entry:
    # **Three terms, and it showed.** Measured 2026-08-29 across the twenty oracle corridors, this
    # role produced **zero** scoring candidates in Germany and Japan and never more than 27
    # anywhere, while `visa_decision` ranged to 465. A page scoring nothing for a role is not
    # merely ranked low — it can never be shortlisted or selected *for that role* at any budget,
    # which is entry 78's finding in a second place. `general_entry` was the largest genuinely-open
    # role in the fixture at 7 of 20 corridors, and the three roles with the fewest terms — this
    # one, `fees` and `processing_times` — were exactly the three that produced no candidates at
    # all. Entry 103.
    #
    # What entry-condition pages actually say, taken from pages already read: Singapore's arrival
    # card and "sufficient funds"; Germany's "means of subsistence" and EUR 30,000 travel
    # insurance; the United Kingdom's "you'll leave at the end of your visit"; Japan's "landing
    # permission" granted at the port. None of that vocabulary was here.
    #
    # `entry requirements` is deliberately **not** added: it already sits in `visa_decision` at 12,
    # and duplicating it across roles would let one phrase decide two roles at once. The same rule
    # as everywhere else in this file applies within the role — no phrase may contain, or be
    # contained by, another, or both fire and the page scores twice.
    #
    # `customs` is left at 8 and is a known mis-attractor: Canada's only `general_entry` candidates
    # were a vehicle-import page and a customs-on-return page. It is not removed in the same change
    # that adds thirteen terms, because then neither could be attributed; the new terms outrank it
    # by 2-3x, which should dilute it. Re-check it once this is measured.
    terms:
      - {phrase: entering, weight: 12}
      - {phrase: arrival card, weight: 15}
      - {phrase: customs, weight: 8}
      - {phrase: entry conditions, weight: 22}
      - {phrase: conditions of entry, weight: 22}
      - {phrase: landing permission, weight: 22}
      - {phrase: immigration clearance, weight: 20}
      - {phrase: means of subsistence, weight: 20}
      - {phrase: sufficient funds, weight: 20}
      - {phrase: passport validity, weight: 18}
      - {phrase: onward travel, weight: 18}
      - {phrase: travel insurance, weight: 15}
      - {phrase: period of stay, weight: 15}
      - {phrase: length of stay, weight: 15}
      - {phrase: border control, weight: 15}
      - {phrase: return ticket, weight: 12}

  travel_authorisation:
    # A pre-travel authorisation that is not a visa — the UK's ETA, the US ESTA, Canada's eTA, New
    # Zealand's NZeTA, Korea's K-ETA (entry 275). **Scored from the title, link text and address
    # only**: every GOV.UK visa page carries the ETA notice, so a body match credited 100 pages and
    # `gov.uk/eta` still never reached the selector. Whole words, because "eta" sits inside
    # "details". "Travel authority" is left out: Australia's ETA is a visa (subclass 601, rule 8g),
    # and the roles prompt keeps it out of this role whatever scores it.
    whole_words: true
    title_and_address_only: true
    terms:
      - {phrase: travel authorisation, weight: 25}
      - {phrase: travel authorization, weight: 25}
      - {phrase: eta, weight: 25}
      - {phrase: esta, weight: 25}
      - {phrase: nzeta, weight: 25}
      - {phrase: etias, weight: 25}

# Purpose words. A page matching the traveller's purpose gains; a page matching a different
# purpose is penalised hard, because that is the wrong-checklist failure mode.
purposes:
  tourism:
    terms: [tourism, tourist, sightseeing, visit, temporary visitor, short-term stay, short stay, holiday]
    weight: 20
  business:
    terms: [business, conference, commercial]
    weight: 20
  study:
    terms: [student, study, college, university]
    weight: 20
  transit:
    terms: [transit, transfer]
    weight: 20

# Terms that indicate a page is for a different traveller entirely. Applied as a penalty unless the
# term belongs to the traveller's own purpose.
off_scope:
  weight: -30
  terms:
    - student
    - study
    - work
    - working
    - employment
    - spouse
    - dependant
    - dependent
    - residence permit
    - long-term
    - long term
    - long stay
    - permanent
    - diplomatic
    - official passport
    - medical stay
    - working holiday

# Audiences a tourist is definitively not. Unlike the scored off_scope terms, these reject the
# page outright when they appear in the link that led to it, because no score should be able to
# outweigh them: the diplomatic-passport exemption list mentions many nationalities and would
# otherwise look like a strong match for an ordinary passport holder.
hard_off_scope:
  - diplomatic
  - official passport
  - service passport
  - spouse
  - working holiday
  - residence permit
  - long-term resident

# A residence permit is a different audience from a tourist — except on the page that asks the
# visa question for everyone. The Netherlands' own checker is linked as "Do I need a visa and/or a
# residence permit for the Netherlands?", and the veto above removed it from every corridor that
# did not happen to find it by search under its page title; Germany's Visa-Navigator went the same
# way (TODO item 70). Terms listed here stop vetoing a link that also carries a visa-question term
# below. The `off_scope` penalty still applies to them, so the link competes on score like any
# other rather than being waved through.
hard_off_scope_beside_visa_question:
  - residence permit
visa_question_terms:
  - need a visa
  - visa required
  - visa navigator

# Path tokens that mark a page as archived or otherwise not current guidance. Auto-reject, not a
# penalty: an archived checklist that still reads plausibly is precisely what must never be used.
archive_tokens: [archive, archived, old, backup, legacy, superseded]

# Site furniture, in the languages the corridors run so far have produced. These pages sit in the
# footer of every page on a government site, and a footer link inherits the last heading above it —
# so France's legal notice collected the heading bonus from a news article about visa requirements
# and took three of ten fetch places from the post that actually serves the traveller. A legal
# notice cannot be visa guidance, so it is rejected rather than merely scored down.
boilerplate_tokens:
  - accessibilite
  - accessibility
  - mentions-legales
  - legal-notice
  - legal-notices
  - donnees-personnelles
  - personal-data
  - privacy
  - privacy-policy
  - cookies
  - cookie-policy
  - sitemap
  - plan-du-site
  - disclaimer
  - copyright
  - credits
  # A subscription form for updates about a topic. Its address repeats the topic's words, so on
  # `www.gov.uk` 21 of them read as visa guidance in one build (entry 186).
  - email-signup
  # The same kind of page under other names, counted across the 53 stores on 2026-09-25 (entry
  # 200): Luxembourg's 31 newsletter pages, a German mission's 14, South Africa's mailing lists.
  # Whole segments only, and deliberately not `signup` or `sign-up`: Egypt's and Thailand's e-visa
  # portals use those for the account a traveller applies through, which is application guidance.
  - newsletter
  - newsletters
  - subscribe
  - subscribe-via-email
  - subscribe-mailing-lists

# A blank form is not a list of what to bring. Both say "application" and "documents", and the
# forms are usually PDFs, so without this they outrank the real checklist. Observed on Japan's
# ministry site, where the application form PDFs beat the embassy's actual checklist.
form_penalty: -35
form_terms:
  - application form
  - form1
  - application1
  - invitation letter
  - letter of guarantee
  - letter of invitation
  - sample form
  - blank form
  - download form

# Translated copies of the same document. Penalised rather than rejected, so an English page is
# preferred without discarding a country that publishes only in its own language.
language_penalty: -25
language_terms:
  - spanish
  - portuguese
  - korean
  - chinese
  - russian
  - arabic
  - french
  - german
  - italian
  - vietnamese
  - thai
  - indonesian
  - mongolian

# A small score for any link that plainly concerns visas, so a real page is never scored zero
# purely because it uses no stock phrase. It is small on purpose: it makes a page eligible to be
# ranked, and the nationality and purpose signals decide which one wins.
base_visa_weight: 6

nationality_weight: 40

# What the traveller's *residence* is worth, and only for the roles the post governs.
#
# `nationality_weight` above rewards a page for being about the passport country, and until
# 2026-09-02 there was no counterpart for the country the traveller applies from — so "this page is
# about country X" could only ever exclude (`wrong_country`), never promote. Canada publishes 635
# "where to submit your application" pages, one per country of application: for an Indian national
# in Britain the `?country=IN` page scored 32.0 and the `?country=GB` page, the one that answers
# them, scored -8.0. DECISIONS entry 126.
#
# Equal to `nationality_weight` on purpose, and it *adds* — nothing is taken off the page about the
# passport country. A first version withdrew the passport bonus from these four roles so the two
# would swap; measured, that removed 25 pages from the selector's pool and added none, and it cost
# New Zealand's only Indian visitor checklist 40 points for a traveller in Britain, where New
# Zealand publishes no British one for it to lose to.
#
# So the two now tie, and the tie is the point: which of two sibling pages answers a traveller is
# not a question a URL scorer should settle. What the request path actually consumes from this
# number is whether it is above zero — `_choose_what_to_read` pools on that and hands the pool to
# the model unsorted, with the scores withheld. Crossing zero is the whole job.
residence_weight: 40

purpose_bonus_weight: 20
shallow_path_weight: 8
depth_penalty_weight: -10
# The mission serving the traveller's residence is the authority for how *they* apply, so it
# should win the checklist and route roles against a ministry's general pages. Applied only to
# those two roles: the ministry remains the better source for the decision itself.
mission_host_bonus: 30
pdf_checklist_bonus: 10

authority_kind_bonus:
  immigration_authority: 6
  foreign_ministry: 4
  embassy_or_high_commission: 2
  official_application_provider: 0

# --- What a document checklist actually is -------------------------------------------------
#
# Every phrase under roles.document_checklist above is *meta*: a page earns them by talking about
# documents. Brazil showed why that is not enough. A generic "how to apply on e-consular" page in
# Riyadh repeats "documents required" and "required documents" and names not one document, and it
# outscored Edinburgh's real tourism checklist — which names a passport, a bank statement, proof of
# funds, an itinerary and a return ticket in prose, and says "checklist" nowhere.
#
# So a checklist is identified by the documents it names. Distinct nouns are counted, not
# occurrences, because a page repeating "passport" twenty times is a passport page, not a list.
document_nouns:
  - passport
  - photograph
  - passport photo
  - application form
  - bank statement
  - proof of funds
  - proof of accommodation
  - proof of address
  - proof of residence
  - itinerary
  - return ticket
  - onward ticket
  - flight reservation
  - hotel booking
  - invitation letter
  - letter of invitation
  - employment letter
  - payslip
  - travel insurance
  - yellow fever
  - birth certificate
  - marriage certificate
  - police certificate
  - criminal record
  - bank reference
  - proof of income
  - certificate of employment
document_noun_weight: 9
document_noun_cap: 5
# Below this many distinct documents a page is talking about a checklist rather than being one,
# so it earns nothing here. One page mentioning "passport" is almost every page on a visa site.
minimum_document_nouns: 3

# --- Which post serves this traveller ------------------------------------------------------
#
# A mission's pages describe how to apply *at that post*: its fees, its address, its appointment
# system. Brazil publishes every mission under one host with the post in the path, so
# `embaixada-riade` and `consulado-edimburgo` are indistinguishable to a host-based check, and a
# Riyadh page won the checklist role for a traveller applying in the UK.
#
# A segment beginning with one of these names a post. What follows it is matched against the
# residence country's `mission_labels` in countries.yaml.
mission_path_markers:
  - consulate
  - consulate-general
  - consulado
  - consulado-geral
  - consulat
  - consulado-general
  - consulaat
  - embassy
  - embaixada
  - embajada
  - ambassade
  - botschaft
  - high-commission
  - highcommission
  - mission

# Another post's page, for the two roles where the post genuinely governs. Large enough to lose to
# the traveller's own mission outright, but not a veto: the content is often replicated across
# posts, so it may still be the only readable copy of something.
other_mission_penalty: -45
