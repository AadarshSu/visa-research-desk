# Governments that publish travel advice for their own citizens, and where (DECISIONS entry 260).
#
# REVIEWED, then committed. Built from `visa-discover advisories` and the review of 2026-10-05
# (`var/advisories/review.tsv`). One row per passport country; a passport with no row gets no panel.
#
# The panel shows a link and nothing else — no page is read, quoted or summarised. Each row says:
#   government / written_for — whose advice it is, as the panel names it.
#   language     — the language the advice is written in; the panel says so when it is not English.
#   domains      — the government's own. A domain the own-government rule cannot confirm (no
#                  governmental marker, or not under the country's own top-level domain) needs
#                  `evidence`, from entry 111's tiers. Checked when this file loads.
#   access       — `open` if its pages opened for us; `refused` if it blocked, challenged or
#                  `Disallow`ed us, or did not answer. A refused government is still linked (the
#                  owner, entry 260), and the panel says the link could not be opened to check.
#   page         — its advice page or index, shown when no page for the destination is known.
#   destinations — how `visa-discover advisory-links` finds the page for each destination. The
#                  links it finds are checked and written to `advisory_links.yaml`, never here.
#
# Not here yet, each for a reason in entry 260: Russia (mid.ru, which links kdmid.ru, has no
# reviewed evidence), Slovakia, Moldova and Jamaica (a destination page seen once, not confirmed),
# Jordan (no index found), Malaysia (per-mission pages only), Bhutan ("old" advisory), and the eight
# unclear governments (Estonia, Turkey, Ukraine, Vietnam, Greece, Lithuania, Latvia, Poland).

schema_version: 1
publishers:
