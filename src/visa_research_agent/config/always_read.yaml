# Pages a country's corridors read on every run, whatever the ranking does (DECISIONS entry 267).
#
# Read, never believed: each page is fetched live after selection and the role adjudicator decides
# what it answers. An exceptions list for a ranking miss, not a way of working — every entry says
# which miss it covers, and comes out once the ranking finds the page by itself.
#
# Every URL must be https on the country's trusted domains in authority_domains.yaml; loading
# refuses anything else.
schema_version: 1
countries:
- code: AU
  pages:
  - url: https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/electronic-travel-authority-601
    title: Electronic Travel Authority (subclass 601)
    purposes: [tourism, business]
    why: >-
      Home Affairs' list of the passports eligible for the ETA, a visa (subclass 601) applied for
      before travel. It states the visa decision for every traveller it lists. Stored with
      corpus-add on 2026-10-06, it ranks 55th by stored text for visa_decision on australia/US/US
      against about twenty places a role, held down by the breadth penalty (entries 265, 266;
      known problem 46).
- code: GB
  pages:
  - url: https://www.gov.uk/eta
    title: Get an electronic travel authorisation (ETA) to visit the UK
    purposes: [tourism, business]
    why: >-
      GOV.UK's ETA overview: "Most visitors need an ETA or a visa", and visitors from the USA and
      others usually need an ETA rather than a visa. It links where the ETA is applied for. In the
      GB store, but absent from the selection pool of 160 on all five united-kingdom/US/US tourism
      runs of 2026-10-07. Three of those stated "no visa" and never mentioned the ETA (entry 272).
      It replaced the ETA eligibility list, which says only that US nationals "can apply", so plans
      read from it left the ETA as an open question.
  - url: https://www.gov.uk/guidance/immigration-rules/immigration-rules-appendix-visitor-visa-national-list
    title: 'Immigration Rules Appendix Visitor: visa national list'
    purposes: [tourism, business]
    why: >-
      The complete list of nationalities who need a visa to visit, which rule 8e reads for the
      decision. In the GB store, but absent from the same five pools; the decision was stated only
      on the runs that happened to read the carriers' list instead, and left open on the others
      (entry 272).
